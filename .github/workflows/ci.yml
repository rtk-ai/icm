name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Fast gates (fail early, save CI minutes) ───

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The `web` and `bench` features are off by default and would otherwise
      # never be compiled in CI — a breakage would ship unnoticed (audit
      # finding).
      - name: Check non-default `web` + `bench` features compile
        run: cargo clippy -p icm-cli --features web,bench --all-targets -- -D warnings

  # ─── Parallel gates (require code to compile) ───

  test:
    name: test (${{ matrix.os }})
    needs: clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Validates the fully-static musl binary shipped for old-glibc distros
  # (issue #330: the glibc binaries need symbols newer than Debian Bookworm's
  # glibc 2.36). Embeddings are dropped because `ort`/onnxruntime ships only
  # glibc prebuilt binaries and can't link statically against musl.
  musl:
    name: musl static build
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static musl binary (no embeddings)
        # sqlite-vec.c uses BSD type names (u_int8_t/u_int16_t/u_int64_t) that
        # glibc provides but musl does not; map them to the standard names.
        env:
          CFLAGS_x86_64_unknown_linux_musl: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
        run: >-
          cargo build --release --target x86_64-unknown-linux-musl -p icm-cli
          --no-default-features --features "backend-sqlite,tui,http-api"
      - name: Verify the binary is fully static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/icm
          file "$bin"
          if ldd "$bin" 2>&1 | grep -Eq "statically linked|not a dynamic executable"; then
            echo "OK: statically linked — runs on any Linux regardless of glibc"
          else
            echo "FAIL: binary is dynamically linked"; ldd "$bin"; exit 1
          fi

  # Validates the load-dynamic embeddings variant (issue #345): it must build
  # WITHOUT onnxruntime (so homebrew-core's network-less sandbox can build it
  # with embeddings), and at runtime degrade to keyword-only search — never
  # crash — when the onnxruntime lib is absent. The release profile is
  # `panic = "abort"`, so this exercises the dlopen pre-flight, not catch_unwind.
  embeddings-dynamic:
    name: load-dynamic embeddings
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build load-dynamic variant (no build-time onnxruntime)
        run: >-
          cargo build -p icm-cli --no-default-features
          --features "embeddings-dynamic,backend-sqlite,tui,http-api"
      - name: Unit-test the dylib pre-flight + ort_runtime helpers
        run: |
          cargo test -p icm-core --features embeddings-dynamic
          cargo test -p icm-cli --no-default-features \
            --features "embeddings-dynamic,backend-sqlite,tui,http-api" ort_runtime
      - name: Graceful degradation when onnxruntime is absent
        # Force the missing-runtime path deterministically. The store must still
        # succeed (keyword-only) and the process must exit 0, not abort.
        env:
          ORT_DYLIB_PATH: /nonexistent/libonnxruntime.so
        run: |
          bin=target/debug/icm
          db="$RUNNER_TEMP/dyn.db"
          "$bin" --db "$db" store -t t -c "ci dynamic graceful delta"
          "$bin" --no-embeddings --db "$db" recall delta | grep -qi delta \
            && echo "OK: degraded to keyword-only without crashing" \
            || { echo "FAIL: memory not stored / recall failed"; exit 1; }
      - name: Opt-in download + semantic search (onnxruntime 1.20.1 ↔ ort ABI)
        # The highest-risk regression: the pinned onnxruntime must load under the
        # `ort` version fastembed uses, or ort's version assertion aborts. Prove
        # it end-to-end — download the runtime, then embed with a small model and
        # confirm a purely semantic recall (query shares no keywords with the
        # stored text, so a keyword hit is impossible).
        run: |
          bin=target/debug/icm
          "$bin" embeddings download
          "$bin" embeddings status | grep -qi "installed" \
            || { echo "FAIL: runtime not reported installed"; exit 1; }
          cfg="$RUNNER_TEMP/icm.toml"
          printf '[embeddings]\nmodel = "Qdrant/all-MiniLM-L6-v2-onnx"\n' > "$cfg"
          db="$RUNNER_TEMP/sem.db"
          ICM_CONFIG="$cfg" "$bin" --db "$db" store -t t -c "the quick brown fox jumps over the lazy dog"
          ICM_CONFIG="$cfg" "$bin" --db "$db" recall "a fast animal leaping above a sleepy canine" | grep -qi fox \
            && echo "OK: downloaded onnxruntime loads under ort and embeds" \
            || { echo "FAIL: semantic search did not work with the downloaded runtime"; exit 1; }
      - name: Lifecycle e2e (store → recall → decay → prune)
        # The full memory lifecycle was only covered by unit tests — nothing
        # proved the shipped binary chains it end-to-end (audit finding). A
        # medium-importance memory decayed to 0.05 must fall to prune at 0.5,
        # and recall must no longer return it.
        run: |
          bin=target/debug/icm
          db="$RUNNER_TEMP/life.db"
          "$bin" --no-embeddings --db "$db" store -t lifecycle -c "lifecycle probe alpha"
          "$bin" --no-embeddings --db "$db" recall alpha | grep -qi "lifecycle probe alpha" \
            || { echo "FAIL: stored memory not recalled"; exit 1; }
          "$bin" --no-embeddings --db "$db" decay -f 0.05
          "$bin" --no-embeddings --db "$db" prune -t 0.5
          if "$bin" --no-embeddings --db "$db" recall alpha | grep -qi "lifecycle probe alpha"; then
            echo "FAIL: memory survived decay+prune"; exit 1
          else
            echo "OK: lifecycle store → recall → decay → prune verified end-to-end"
          fi

  # Same load-dynamic variant on Windows (issue #345): the onnxruntime asset is a
  # `.zip` (not the unix `.tgz`) and the runtime is `onnxruntime.dll`, so this
  # exercises the zip extractor and the `LoadLibraryW` pre-flight. It's the only
  # real proof that the pinned onnxruntime loads under ort's ABI on Windows.
  embeddings-dynamic-windows:
    name: load-dynamic embeddings (windows)
    needs: clippy
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build load-dynamic variant (no build-time onnxruntime)
        run: >-
          cargo build -p icm-cli --no-default-features
          --features "embeddings-dynamic,backend-sqlite,tui,http-api"
      - name: Unit-test the dll pre-flight + ort_runtime helpers
        run: |
          cargo test -p icm-core --features embeddings-dynamic
          cargo test -p icm-cli --no-default-features \
            --features "embeddings-dynamic,backend-sqlite,tui,http-api" ort_runtime
      - name: Graceful degradation when onnxruntime is absent
        # A bogus ORT_DYLIB_PATH must degrade to keyword-only, never abort.
        env:
          ORT_DYLIB_PATH: C:\nonexistent\onnxruntime.dll
        run: |
          bin=target/debug/icm.exe
          "$bin" --version  # smoke: the binary must launch (8 MiB stack, see .cargo/config.toml)
          db="$RUNNER_TEMP/dyn.db"
          "$bin" --db "$db" store -t t -c "ci dynamic graceful delta"
          "$bin" --no-embeddings --db "$db" recall delta | grep -qi delta \
            && echo "OK: degraded to keyword-only without crashing" \
            || { echo "FAIL: memory not stored / recall failed"; exit 1; }
      - name: Opt-in download + semantic search (onnxruntime 1.20.1 ↔ ort ABI)
        # Highest-risk regression on Windows: the pinned onnxruntime.dll must load
        # under the `ort` version fastembed uses, or ort's version assertion
        # aborts. Prove it end-to-end with a purely semantic recall.
        run: |
          bin=target/debug/icm.exe
          "$bin" embeddings download
          "$bin" embeddings status | grep -qi "installed" \
            || { echo "FAIL: runtime not reported installed"; exit 1; }
          cfg="$RUNNER_TEMP/icm.toml"
          printf '[embeddings]\nmodel = "Qdrant/all-MiniLM-L6-v2-onnx"\n' > "$cfg"
          db="$RUNNER_TEMP/sem.db"
          ICM_CONFIG="$cfg" "$bin" --db "$db" store -t t -c "the quick brown fox jumps over the lazy dog"
          ICM_CONFIG="$cfg" "$bin" --db "$db" recall "a fast animal leaping above a sleepy canine" | grep -qi fox \
            && echo "OK: downloaded onnxruntime.dll loads under ort and embeds" \
            || { echo "FAIL: semantic search did not work with the downloaded runtime"; exit 1; }

  # The postgres backend ships in the DEFAULT binary but its integration
  # tests skip without ICM_POSTGRES_URL, which no workflow ever set — the
  # backend had zero CI execution (audit finding). pgvector/pgvector matches
  # the image the test header documents. (opensearch: same gap, heavier
  # container — tracked separately.)
  postgres-backend:
    name: postgres backend tests
    needs: clippy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: icm
          POSTGRES_PASSWORD: icm
          POSTGRES_DB: icm
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U icm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run postgres integration tests
        env:
          ICM_POSTGRES_URL: postgres://icm:icm@127.0.0.1:55432/icm
          # Backend selection is a RUNTIME switch (default: sqlite). Without
          # this the no-default-features build errors out asking for the
          # sqlite feature before ever touching postgres.
          ICM_DB_BACKEND: postgres
        run: |
          # --test-threads=1: both tests migrate the same shared database, and
          # concurrent `CREATE EXTENSION IF NOT EXISTS vector` races in
          # Postgres (duplicate-key on the catalog) — seen flaking in CI.
          cargo test -p icm-store --no-default-features --features postgres \
            --test postgres_backend -- --nocapture --test-threads=1 2>&1 | tee pg.log
          test "${PIPESTATUS[0]}" -eq 0 || exit 1
          # The skip guard must NOT have fired — prove the tests actually ran.
          if grep -q "skipping: ICM_POSTGRES_URL not set" pg.log; then
            echo "FAIL: tests skipped despite the service container"; exit 1
          fi

  security:
    name: security scan
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Cargo Audit (CVE check)
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          if cargo audit 2>&1 | tee audit.log; then
            echo "No known vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "Vulnerabilities found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat audit.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::warning::Dependency vulnerabilities detected — review required"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: New dependencies check
        run: |
          echo "### New Dependencies" >> $GITHUB_STEP_SUMMARY
          if git diff origin/${{ github.base_ref }}...HEAD -- '**/Cargo.toml' \
            | grep -E "^\+.*=" | grep -v "^\+\+\+" > new_deps.txt; then
            echo "**New dependencies added:**" >> $GITHUB_STEP_SUMMARY
            echo '```toml' >> $GITHUB_STEP_SUMMARY
            cat new_deps.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Required Actions:**" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Audit each new dependency on crates.io" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Verify maintainer reputation and download counts" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Check for typosquatting" >> $GITHUB_STEP_SUMMARY
            echo "::warning::New dependencies require supply-chain audit"
          else
            echo "No new dependencies added" >> $GITHUB_STEP_SUMMARY
          fi
