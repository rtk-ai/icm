name: Release

# Builds the release artifacts (release-build.yml), publishes them to the
# GitHub release for a tag, and updates the Homebrew formula.
#
# Callers:
#   - cd.yml, for every stable release (release-please) and every develop
#     pre-release. This is the only automatic trigger. The former
#     `release: published` trigger is gone on purpose: release-please
#     publishes with a GitHub App token, so that event fired too and every
#     release was built and uploaded twice, by two racing runs that produced
#     different bytes (the tap got two "icm 0.10.63" commits 15 seconds
#     apart with different SHA256 sums).
#   - by hand (workflow_dispatch). It defaults to a dry run: nothing is
#     published unless `dry_run` is unticked. For a plain "does everything
#     still build" check, use the "Release build check" workflow instead.
#
# Order of operations for a stable release, so that install.sh and
# `icm upgrade` (both follow /releases/latest) never see a release without
# its assets:
#   1. cd.yml flags the release release-please just created as a
#      pre-release, which takes it out of /releases/latest;
#   2. everything is built, smoke-tested and checked against the manifest
#      (scripts/release-check.sh) BEFORE anything is uploaded;
#   3. the assets are uploaded, downloaded back and verified again, and the
#      release notes get their heading on semantic search per file;
#   4. only then is the release promoted to a full release and to "latest".
# If any step fails, "latest" still points at the previous complete release.
#
# The assets are always built from the commit the run is on. A tag that
# already exists must point at that same commit, or nothing is uploaded: to
# publish again under an existing tag, run this workflow from the tag.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as pre-release (skips Homebrew + latest tag)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Build and verify only, publish nothing'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. icm-v0.10.66). Built from the ref this workflow is run from: for a tag that already exists, run it from that tag.'
        required: true
      prerelease:
        description: 'Mark the release as pre-release'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run: build and verify only, publish nothing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      expected_version: ${{ steps.plan.outputs.expected_version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Resolve tag, version and mode
        id: plan
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$TAG" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error::invalid tag '$TAG'"
              exit 1
              ;;
          esac
          # Strip tag prefixes: "icm-v0.10.1" → "0.10.1", "v0.10.1" → "0.10.1"
          version="${TAG#icm-v}"
          version="${version#v}"
          # A stable release must be built from the commit that carries its
          # version: every binary has to report exactly this number.
          # Pre-release tags (icm-dev-v0.10.66-rc.12) are ahead of the
          # version in Cargo.toml, so there is nothing to compare.
          expected_version=""
          if [ "$PRERELEASE" != "true" ]; then
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::a stable release tag must look like icm-vX.Y.Z, got '$TAG'"
              exit 1
            fi
            expected_version="$version"
          fi
          # Publishing takes an explicit "false": an empty or unexpected
          # value (an input renamed, a new caller) is a dry run.
          publish=false
          if [ "$DRY_RUN" = "false" ]; then
            publish=true
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "expected_version=$expected_version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$version prerelease=$PRERELEASE publish=$publish" >> "$GITHUB_STEP_SUMMARY"
          if [ "$publish" != "true" ]; then
            # Said on the run page, so a release that was meant to publish
            # and did not is not mistaken for one that did.
            echo "::notice title=Dry run::$TAG is built and verified, nothing is published (dry_run is '$DRY_RUN')."
          fi

  build:
    name: Build
    needs: plan
    uses: ./.github/workflows/release-build.yml
    with:
      expected_version: ${{ needs.plan.outputs.expected_version }}
    permissions:
      contents: read

  publish:
    name: Publish release assets
    # `needs: build` is the first gate: one failed build, one failed smoke
    # test or one missing asset and this job does not run at all.
    needs: [plan, build]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_latest: ${{ steps.finalize.outputs.is_latest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse a tag that points at another commit
        # The bundle was built from $GITHUB_SHA. Uploading it under a tag
        # that sits on a different commit would replace the files of that
        # release with a build of other code: between two releases the
        # version number alone does not tell them apart.
        run: |
          set -euo pipefail
          # One line for a lightweight tag, a second "^{}" line with the
          # commit for an annotated one, nothing when the tag does not exist.
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          tag_commit=$(printf '%s\n' "$refs" | awk '
            index($2, "^{}") { peeled = $1 }
            NF && !index($2, "^{}") { plain = $1 }
            END { print (peeled != "" ? peeled : plain) }')
          if [ -z "$tag_commit" ]; then
            echo "Tag $TAG does not exist yet: it will be created on $GITHUB_SHA."
          elif [ "$tag_commit" = "$GITHUB_SHA" ]; then
            echo "Tag $TAG points at $GITHUB_SHA, the commit that was built."
          else
            echo "::error::tag $TAG points at $tag_commit but this run built $GITHUB_SHA: nothing was uploaded. Run this workflow from the tag $TAG itself to publish its own code."
            exit 1
          fi

      - name: Download the verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Check the bundle once more before upload
        run: sh scripts/release-check.sh verify release "$VERSION"

      - name: Upload assets
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Stable path: release-please created the release (notes included).
            gh release upload "$TAG" release/* --clobber
          else
            # Pre-release path, or a tag released by hand. `gh release create`
            # uploads to a draft and publishes it only once every asset is in.
            # Always created as a pre-release; "Promote" below decides.
            gh release create "$TAG" release/* \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

      - name: Verify what GitHub serves
        # The second gate, on the real thing: download every asset back,
        # require exactly the expected set and matching SHA256 sums.
        run: |
          set -euo pipefail
          rm -rf published
          gh release download "$TAG" --dir published
          sh scripts/release-check.sh verify published "$VERSION"
          cmp release/checksums.txt published/checksums.txt

      - name: Head the release notes with semantic search per file
        # Some builds leave semantic search off until the user runs a
        # command, and an update can take it away: said first in the notes,
        # before the release becomes "latest". The text comes from the same
        # manifest the builds were checked against. Runs once per release:
        # the marker line tells a re-run the heading is already there.
        run: |
          set -euo pipefail
          sh scripts/release-check.sh notes "$VERSION" > notes-head.md
          marker=$(head -n 1 notes-head.md)
          gh release view "$TAG" --json body --jq .body > notes-body.md
          if grep -Fq -- "$marker" notes-body.md; then
            echo "The release notes already carry the heading."
          else
            { cat notes-head.md; echo; cat notes-body.md; } > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

      - name: Promote the release
        id: finalize
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # "latest" goes to the highest stable version, so re-publishing the
          # assets of an older tag never moves it backwards.
          newest=$( { gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
                        --json tagName --jq '.[].tagName'; echo "$TAG"; } \
                    | { grep -E '^icm-v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1 )
          if [ "$newest" = "$TAG" ]; then
            gh release edit "$TAG" --prerelease=false --latest
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is older than $newest: published, but not marked latest"
            gh release edit "$TAG" --prerelease=false --latest=false
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  homebrew:
    name: Update Homebrew formula
    needs: [plan, publish]
    # Stable releases only, and only for the newest one.
    if: ${{ inputs.prerelease != true && needs.publish.outputs.is_latest == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Download checksums
        run: |
          gh release download "$TAG" \
            --repo rtk-ai/icm \
            --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write formula
        # Match field 2 exactly so the lookup is unambiguous even if other
        # rows with overlapping prefixes ever land in checksums.txt. A
        # missing sum stops the job: an empty sha256 must never reach the tap.
        run: |
          set -euo pipefail
          sha_for() {
            sum=$(awk -v f="$1" '$2 == f {print $1; exit}' checksums.txt)
            if ! printf '%s' "$sum" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::no SHA256 for $1 in checksums.txt" >&2
              return 1
            fi
            printf '%s' "$sum"
          }
          SHA_ARM=$(sha_for icm-aarch64-apple-darwin.tar.gz)
          SHA_INTEL=$(sha_for icm-x86_64-apple-darwin.tar.gz)
          SHA_LINUX=$(sha_for icm-x86_64-unknown-linux-gnu.tar.gz)
          SHA_LINUX_ARM=$(sha_for icm-aarch64-unknown-linux-gnu.tar.gz)
          BASE="https://github.com/rtk-ai/icm/releases/download/${TAG}"
          # Unquoted heredoc: only the ${...} shell variables above are
          # expanded. Ruby's #{...} is left alone by the shell.
          cat > icm.rb << FORMULA
          class Icm < Formula
            desc "Permanent memory for AI agents — MCP server with hybrid search"
            homepage "https://github.com/rtk-ai/icm"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_intel do
                url "${BASE}/icm-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_INTEL}"
              end
              on_arm do
                url "${BASE}/icm-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              end
            end

            on_linux do
              on_intel do
                url "${BASE}/icm-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX}"
              end
              on_arm do
                url "${BASE}/icm-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
            end

            def install
              bin.install "icm"
            end

            def caveats
              if OS.linux?
                <<~EOS
                  Keyword search works out of the box. For semantic search,
                  fetch the ONNX Runtime once:
                    icm embeddings download
                EOS
              elsif Hardware::CPU.intel?
                <<~EOS
                  Keyword search works out of the box. No ONNX Runtime 1.24+ is
                  published for Intel Macs: for semantic search, set
                  ORT_DYLIB_PATH to your own libonnxruntime.dylib.
                EOS
              end
            end

            test do
              assert_match "icm #{version}", shell_output("#{bin}/icm --version")
            end
          end
          FORMULA
          cat icm.rb

      - name: Push to homebrew-tap
        # By now the release is complete and promoted. A push that fails
        # (an expired HOMEBREW_TAP_TOKEN, for one) is reported as a warning
        # and does not fail the run: a failure here would make cd.yml skip
        # the 'latest' tag and the back-merge of a release that is out.
        run: |
          CONTENT=$(base64 -w 0 icm.rb)
          push_formula() {
            SHA=$(gh api repos/rtk-ai/homebrew-tap/contents/Formula/icm.rb --jq '.sha' 2>/dev/null || echo "")
            if [ -n "$SHA" ]; then
              gh api -X PUT repos/rtk-ai/homebrew-tap/contents/Formula/icm.rb \
                -f message="icm ${VERSION}" \
                -f content="$CONTENT" \
                -f sha="$SHA"
            else
              gh api -X PUT repos/rtk-ai/homebrew-tap/contents/Formula/icm.rb \
                -f message="icm ${VERSION}" \
                -f content="$CONTENT"
            fi
          }
          if push_formula > push.log 2>&1; then
            echo "Formula/icm.rb in rtk-ai/homebrew-tap now installs icm ${VERSION}."
          else
            cat push.log
            echo "::warning title=Homebrew formula not updated::Release ${TAG} is published, but the push to rtk-ai/homebrew-tap failed: brew still installs the previous version. Check the HOMEBREW_TAP_TOKEN secret, then re-run this job."
            {
              echo "### Homebrew formula not updated"
              echo "Release ${TAG} is published and complete. The push of Formula/icm.rb to rtk-ai/homebrew-tap failed, so \`brew install icm\` still gives the previous version."
              echo "Check the HOMEBREW_TAP_TOKEN secret, then re-run this job: it only rewrites the formula."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
