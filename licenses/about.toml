# cargo-about configuration: lists the licenses of every crate linked into
# icm, for THIRD-PARTY-LICENSES.md in the release archives
# (scripts/third-party-licenses.sh). A crate whose license is not accepted
# here fails the generation.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "WTFPL",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
